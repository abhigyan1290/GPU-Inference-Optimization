[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-inference-lab"
version = "0.1.0"
description = "A measured, reproducible GPU inference baseline"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0", "transformers==4.51.3", "safetensors>=0.5"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
